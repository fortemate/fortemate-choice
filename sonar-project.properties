sonar.projectKey=fortemate_fortemate-choice
sonar.organization=fortemate
sonar.host.url=https://sonarcloud.io
sonar.projectName=Fortemate Choice
sonar.sourceEncoding=UTF-8
sonar.sources=src,laboratory,eslint-local,scripts
sonar.tests=src,eslint-local,scripts,e2e
sonar.test.inclusions=**/*.test.ts,**/*.test.mjs,e2e/**/*.spec.ts
sonar.exclusions=**/*.test.ts,**/*.test.mjs,src/lib/paraglide/**,src/laboratory/test-support/**,**/evidence/**
sonar.javascript.lcov.reportPaths=coverage/lcov.info
# Entrypoints/erased DTOs and Node integration tooling are outside Vitest instrumentation.
sonar.coverage.exclusions=laboratory/**,src/laboratory/main.ts,src/lib/live/liveTypes.ts,src/lib/moveTreeWalker.ts,scripts/**
