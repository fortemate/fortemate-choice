[tools]
node = "26.13.1"
lefthook = "latest"
betterleaks = "latest"

[tasks.setup]
description = "📦 Install locked project dependencies"
run = "npm ci"

[tasks.dev]
description = "🚀 Start Vite dev server"
run = "npm run dev"

[tasks.compile]
description = "🏗️ Build the static SPA"
run = "npm run build"

[tasks.check]
description = "✅ Lint + format check + svelte-check"
run = "npm run check"

[tasks.format]
description = "🎨 Format with Prettier"
run = "npm run format"

[tasks.test]
description = "🧪 Run unit tests"
run = "npm run test"

[tasks."hook:install"]
description = "🪝 Register Git hooks via lefthook"
run = "lefthook install"

[tasks."hook:run"]
description = "🏃 Run all pre-commit hook jobs manually"
run = "lefthook run pre-commit --all-files"
