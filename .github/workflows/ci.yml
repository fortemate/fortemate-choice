name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  checks:
    name: Check, test, build, and smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.1
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Generate Paraglide sources
        run: npm run prepare

      - name: Check lint, formatting, and types
        run: npm run check

      - name: Run unit and oracle tests
        run: npm test

      - name: Check installed and server rules versions
        run: npm run check:rules-version

      - name: Collect unit coverage
        run: npm run test:coverage

      - name: Build laboratory client
        run: npm run build
        env:
          VITE_LAB_API_URL: http://127.0.0.1:8081

      - name: Install Playwright Chromium
        run: node node_modules/@playwright/test/cli.js install --with-deps chromium

      - name: Run browser smoke tests
        run: npm run test:e2e

      - name: Build the isolated Cloudflare preview
        run: npm run build:hosting && npm run check:hosting
        env:
          CHOICE_PREVIEW_API_URL: http://127.0.0.1:8081

      - name: Check native Cloudflare routes and browser flows
        run: npm run test:hosting
        env:
          CHOICE_PREVIEW_API_URL: http://127.0.0.1:8081

      - name: Validate the closed preview build without deployment
        run: npm run build:closed-preview && npm run check:hosting
        env:
          CHOICE_PREVIEW_API_URL: https://choice-preview-web.example.test
          CHOICE_PREVIEW_VPC_SERVICE_ID: 01234567-89ab-cdef-0123-456789abcdef

      - name: Validate the isolated backend configuration
        run: docker compose --file ops/choice-preview/compose.yaml config --quiet
        env:
          CHOICE_PREVIEW_ORIGIN: https://choice-preview-web.example.test
          CHOICE_PREVIEW_APP_PASSWORD_FILE: /tmp/choice-preview-app
          CHOICE_PREVIEW_DB_ADMIN_PASSWORD_FILE: /tmp/choice-preview-admin
          CHOICE_PREVIEW_TUNNEL_TOKEN_FILE: /tmp/choice-preview-tunnel

      - name: Analyze with SonarQube Cloud
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: SonarSource/sonarqube-scan-action@59202af334b4ba7b5db01b701b8e79f8b3bef0f4 # v8.5.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: -Dsonar.qualitygate.wait=true

      - name: Upload laboratory screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: laboratory-previews
          path: |
            test-results/**/lab-*.png
            !test-results/hosting/**
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload native hosting screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hosting-previews
          path: test-results/hosting/**/lab-*.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Playwright failure traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-failure-traces
          path: test-results/**/*.zip
          if-no-files-found: ignore
          retention-days: 7
